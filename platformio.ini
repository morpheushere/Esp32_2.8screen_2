[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
; This board's CH340 USB-serial bridge -- confirm with `ls /dev/cu.*` before
; flashing, since enumeration can shift between sessions/USB ports.
upload_port = /dev/cu.usbserial-210
monitor_port = /dev/cu.usbserial-210
board_build.flash_size = 4MB
; Default partition scheme's ~1.3MB app slot isn't enough once WiFi+HTTPS
; (mbedTLS) code is actually linked in (mock mode never called those APIs,
; so the linker could drop them; the live path can't). We don't use OTA, so
; reclaiming that space for a single ~3MB app partition is the standard fix.
board_build.partitions = huge_app.csv
build_flags =
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^6.21.5
