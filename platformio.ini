; Cheap Yellow Display (ESP32-2432S028R) -- backyard weather ambient display
; Ported from https://github.com/morpheushere/ESP32_experiment1 (Waveshare
; ESP32-C6-LCD-1.47, 172x320 portrait) to this board's 240x320 ILI9341 panel,
; run landscape (320x240) here, plus its resistive touchscreen.

[env:esp32-2432S028R]
; Classic ESP32 (not C6), so the official espressif32 platform's Arduino
; framework support works directly -- no community platform fork needed.
platform = espressif32
board = esp32dev
framework = arduino
; Default partition scheme (two ~1.25MB OTA app slots + spiffs) -- already
; confirmed to fit firmware flashed on this exact board; no OTA is done here
; (flash over USB), but there's no need to move off the default layout.
monitor_speed = 115200
; USB-serial port for this board's CH340 bridge -- confirm with `ls /dev/cu.*`
; before flashing, since enumeration can shift between sessions/USB ports.
upload_port = /dev/cu.usbserial-210
monitor_port = /dev/cu.usbserial-210

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.7
    bblanchon/ArduinoJson@^7.4.3
    ; Not published under this name in the PlatformIO registry -- pull the
    ; canonical library straight from its GitHub repo instead.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    -DCORE_DEBUG_LEVEL=1
